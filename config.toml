# english_tutor runtime configuration

[user]
# Native language informs L1-interference targeting in grammar review prompts.
native_language = "Spanish"
cefr_level = "B2"

[llm]
base_url = "http://127.0.0.1:8080"
model = "Qwen3-4B-Instruct-2507"
temperature = 0.2
max_tokens = 1024

[asr]
# distil-small.en reproduces learner errors verbatim, which is what the grammar
# reviewer needs; small.en normalized "peoples" to "People's" in measurement.
# It is also smaller (275 vs 371 MiB) and faster (5.2x vs 4.5x realtime).
model_size = "distil-small.en"
device = "cuda"
# Pascal (sm_61) has no efficient FP16. ctranslate2 reports only
# {int8, int8_float32, float32} for cuda here, and rejects int8_float16 with a
# ValueError that backend/asr.py converts into a silent CPU fallback.
compute_type = "int8"
beam_size = 1

[tts]
voice = "en_US-amy-medium"

[server]
host = "127.0.0.1"
port = 8765
data_dir = "data"

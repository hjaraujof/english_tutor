# english_tutor runtime configuration

[user]
# Native language informs L1-interference targeting in grammar review prompts.
native_language = "Spanish"
cefr_level = "B2"

[llm]
base_url = "http://127.0.0.1:8080"
model = "Qwen3-4B-Instruct-2507"
temperature = 0.2
max_tokens = 1024

[asr]
# distil-small.en reproduces learner errors verbatim, which is what the grammar
# reviewer needs; small.en normalized "peoples" to "People's" in measurement.
# It is also smaller (275 vs 371 MiB) and faster (5.2x vs 4.5x realtime).
model_size = "distil-small.en"
device = "cuda"
# Pascal (sm_61) has no efficient FP16. ctranslate2 reports only
# {int8, int8_float32, float32} for cuda here, and rejects int8_float16 with a
# ValueError that backend/asr.py converts into a silent CPU fallback.
compute_type = "int8"
beam_size = 1

[tts]
voice = "en_US-amy-medium"

[live]
# How long you may pause mid-sentence before the tutor decides your turn is
# over. Measured against silero-vad with a two-clause sentence: at 600 ms every
# pause of 600 ms or longer split the sentence, and only the first clause
# reached the ASR. 1200 ms holds a 1-second pause; 2000 ms holds 1.5 seconds.
# Raise it for a lower CEFR level — less fluent speakers pause longer to find
# words. The cost is that the tutor waits this long before it answers.
silence_end_ms = 1200
max_utterance_seconds = 30.0

[server]
host = "127.0.0.1"
port = 8765
data_dir = "data"

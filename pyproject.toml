[project]
name = "english-tutor"
version = "0.1.0"
description = "Local English tutor (grammar review + speaking fluency) with faster-whisper + llama.cpp + Piper"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "python-multipart>=0.0.31",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
phase2 = [
    "silero-vad>=6.2.1",
    "torch>=2.12.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running llama-server",
]

[project]
name = "english-tutor"
version = "0.1.0"
description = "Local English tutor (grammar review + speaking fluency) with faster-whisper + llama.cpp + Piper"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
phase2 = [
    "silero-vad>=6.2.1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
# Integration tests (live llama-server) run only when requested explicitly
# (pytest -m integration); a later -m on the CLI overrides this default.
addopts = "-m 'not integration'"
markers = [
    "integration: requires running llama-server",
]
